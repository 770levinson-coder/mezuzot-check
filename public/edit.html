<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>עדכון פרטי הרשמה – בדיקת מזוזות</title>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; direction:rtl; }
  .card { background:#fff; max-width:480px; margin:30px auto; border-radius:12px; padding:28px; box-shadow:0 2px 12px rgba(0,0,0,.1); }
  h2 { color:#F58C28; margin-top:0; }
  label { display:block; margin:14px 0 4px; font-weight:600; color:#333; }
  select, input[type=number] { width:100%; padding:10px; border:1px solid #ccc; border-radius:8px; font-size:16px; box-sizing:border-box; }
  button { width:100%; padding:13px; background:#F58C28; color:#fff; border:none; border-radius:8px; font-size:17px; cursor:pointer; margin-top:18px; }
  button:hover { background:#d97820; }
  .msg { text-align:center; padding:15px; border-radius:8px; margin-top:14px; }
  .msg.ok { background:#d4edda; color:#155724; }
  .msg.err { background:#f8d7da; color:#721c24; }
  .info { background:#fff8f0; border:1px solid #F58C28; border-radius:8px; padding:12px; margin-bottom:16px; font-size:14px; color:#555; }
</style>
</head>
<body>
<div class="card">
  <h2>📜 עדכון פרטי הרשמה</h2>
  <div class="info" id="current-info">טוען פרטים...</div>
  <form id="edit-form">
    <div style="margin-bottom:16px">
    <label style="font-weight:600">אופן קבלת השירות:</label>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:normal"><input type="radio" name="delivery-mode" value="self" id="radio-self" onchange="setDeliveryMode(false)" checked style="width:18px;height:18px;accent-color:#800020" /> <span>אביא את המזוזות אלינו</span></label>
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:normal"><input type="radio" name="delivery-mode" value="delivery" id="radio-delivery" onchange="setDeliveryMode(true)" style="width:18px;height:18px;accent-color:#800020" /> <span>שירות הגעה לבית <small style="color:#888">(תוספת 30 ₪)</small></span></label>
    </div>
  </div>
    <label for="qty-select">מספר מזוזות</label>
    <select id="qty-select"></select>
    <div id="slot-wrap">
    <label for="slot-select">שעת הגעה</label>
    <select id="slot-select"></select>
    </div>
    <div id="address-group" style="display:none">
    <label for="inp-address">כתובת</label>
    <input type="text" id="inp-address" placeholder="רחוב, מספר בית, קומה" />
    </div>
    <button type="submit">עדכן פרטים</button>
  </form>
  <div id="msg"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('id');
if (!id) { document.getElementById('current-info').textContent = 'קישור לא תקין.'; document.getElementById('edit-form').style.display='none'; }

let currentAppt = null;
let eventConfig = null;

async function init() {
  if (!id) return;

  // Fetch event config for minutesPerMezuza
  const ec = await fetch('/api/event');
  eventConfig = await ec.json();

  const r = await fetch('/api/appt/'+id);
  if (!r.ok) { document.getElementById('current-info').textContent = 'לא נמצאה הרשמה.'; document.getElementById('edit-form').style.display='none'; return; }
  currentAppt = await r.json();

  document.getElementById('current-info').innerHTML =
    'שלום <strong>'+currentAppt.name+'</strong>,<br>'+
    'הרשמה נוכחית: <strong>'+currentAppt.qty+'</strong> מזוזות | שעה: <strong>'+currentAppt.startTime+'–'+currentAppt.endTime+'</strong>';

  // Fill qty options
  const qtyEl = document.getElementById('qty-select');
  for (let i=1; i<=10; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = i + ' מזוזות';
    if (i === currentAppt.qty) o.selected = true;
    qtyEl.appendChild(o);
  }

  // Load slots for current qty
  await loadSlots(currentAppt.qty);
  setDeliveryMode(!!currentAppt.delivery);
  if (currentAppt.address) document.getElementById('inp-address').value = currentAppt.address;
  if (currentAppt.delivery) document.getElementById('radio-delivery').checked = true;

  qtyEl.addEventListener('change', () => loadSlots(parseInt(qtyEl.value)));
}

function toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
function toTime(m) { return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }

async function loadSlots(qty) {
  const slotEl = document.getElementById('slot-select');
  slotEl.innerHTML = '<option>טוען שעות...</option>';
  const r = await fetch('/api/slots?qty='+qty);
  let starts = [];
  if (r.ok) {
    const data = await r.json();
    starts = data.slots || [];
  }
  // Always include current slot
  if (currentAppt && !starts.includes(currentAppt.startTime) && currentAppt.startTime !== '—') {
      starts.unshift(currentAppt.startTime);
  }
  slotEl.innerHTML = '';
  const mpp = (eventConfig && eventConfig.minutesPerMezuza) || 4;
  starts.forEach(st => {
    const endTime = toTime(toMin(st) + qty * mpp);
    const o = document.createElement('option');
    o.value = st+'|'+endTime;
    o.textContent = st;
    if (st === currentAppt.startTime) o.selected = true;
    slotEl.appendChild(o);
  });
  if (slotEl.options.length === 0) {
    slotEl.innerHTML = '<option disabled>אין שעות פנויות לכמות זו</option>';
  }
}

document.getElementById('edit-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const qty = parseInt(document.getElementById('qty-select').value);
  const delivery = document.querySelector('input[name="delivery-mode"]:checked').value === 'delivery';
  const address = document.getElementById('inp-address').value.trim();
  let startTime = '—', endTime = '—';
  if (!delivery) {
    const parts = document.getElementById('slot-select').value.split('|');
    startTime = parts[0]; endTime = parts[1];
  }
  const r = await fetch('/api/edit/'+id, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ qty, startTime, endTime, delivery, address })
  });
  const msgEl = document.getElementById('msg');
  if (r.ok) {
    msgEl.className='msg ok'; msgEl.textContent='הפרטים עודכנו בהצלחה!';
    document.getElementById('current-info').innerHTML =
      'שלום <strong>'+currentAppt.name+'</strong>,<br>'+
      'הרשמה מעודכנת: <strong>'+qty+'</strong> מזוזות'+
      (delivery ? '<br>שירות הגעה לבית: <strong>'+address+'</strong>' : ' | שעה: <strong>'+startTime+'–'+endTime+'</strong>');
  } else {
    const err = await r.json().catch(()=>({}));
    msgEl.className='msg err'; msgEl.textContent='שגיאה: '+(err.error||'נסה שוב');
  }
});

function setDeliveryMode(isDelivery) {
  const slotWrap = document.getElementById('slot-wrap');
  const wasDelivery = slotWrap.style.display === 'none';
  slotWrap.style.display = isDelivery ? 'none' : 'block';
  document.getElementById('address-group').style.display = isDelivery ? 'block' : 'none';
  if (!isDelivery && wasDelivery) {
    loadSlots(parseInt(document.getElementById('qty-select').value) || 1);
  }
}

init();
</script>
</body>
</html>
